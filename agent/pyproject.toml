[project]
name = "voice-agent"
version = "0.1.0"
description = "Outbound speed-to-lead voice agent (LiveKit Agents) with an admin API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.2",
    "livekit-agents~=1.8.12",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["llm: talks to a real LLM through LiveKit Inference (needs LIVEKIT_* env)"]
